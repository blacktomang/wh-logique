services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wh_logique}
      POSTGRES_USER: ${POSTGRES_USER:-wh_logique}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wh_logique_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-wh_logique}:${POSTGRES_PASSWORD:-wh_logique_dev}@postgres:5432/${POSTGRES_DB:-wh_logique}?sslmode=disable
      - up
    restart: "no"

  backend:
    build:
      context: ./apps/backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-wh_logique}:${POSTGRES_PASSWORD:-wh_logique_dev}@postgres:5432/${POSTGRES_DB:-wh_logique}?sslmode=disable
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
